id: https://w3id.org/ontogpt/nature
name: nature
title: Nature Ontology
description: >-
  A schema for extracting nature-related information as subject-predicate-object
  triples. The triple predicates use the Wikidata properties defined in the
  original nature ontology.
license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  linkml: https://w3id.org/linkml/
  nature: https://w3id.org/ontogpt/nature/
  wd: http://www.wikidata.org/entity/
  wdt: http://www.wikidata.org/prop/direct/

default_prefix: nature
default_range: string

imports:
  - linkml:types
  - core

enums:
  DefinedPredicates:
    description: >-
      The only permitted relationship predicates for nature knowledge graph
      extraction. These values are a complete and exclusive set of allowed predicates. Only take predicates from these permissible values,
      and do not invent or use a synonym for these predicates. Use the exact spelling that this list of predicates define.
    permissible_values:
      parent_taxon:
        description: The parent taxon of the taxon. The subject must be an instance of the class taxon. The object must be an instance of the class taxon.
        meaning: wdt:P171

      mountain_range:
        description: The mountain range to which the mountain belongs. The subject must be an instance of the class mountain. The object must be an instance of the class mountain range.
        meaning: wdt:P4552

      parent_peak:
        description: The parent peak of the mountain. The subject must be an instance of the class mountain. The object must be an instance of the class mountain.
        meaning: wdt:P3137

      taxon_common_name:
        description: The common name of the taxon. The subject must be an entity of class Q7432 (class label not specified in the source ontology).
        meaning: wdt:P1843

      tributary:
        description: A watercourse that flows into the subject watercourse. The subject must be an instance of the class watercourse. The object must be an instance of the class watercourse.
        meaning: wdt:P974

      origin_of_the_watercourse:
        description: The source or origin of the watercourse. The subject must be an instance of the class watercourse. The object must be an instance of the class body of water.
        meaning: wdt:P885

      mouth_of_the_watercourse:
        description: The watercourse into which the subject watercourse flows at its mouth. The subject must be an instance of the class watercourse. The object must be an instance of the class watercourse.
        meaning: wdt:P403

      iucn_conservation_status:
        description: The IUCN conservation status of the taxon. The subject must be an instance of the class taxon. The object must be an instance of the class conservation status.
        meaning: wdt:P141

      taxon_synonym:
        description: A synonym of the taxon name. The subject must be an instance of the class taxon. The object must be an instance of the class synonym.
        meaning: wdt:P1420

      reservoir_created:
        description: The reservoir created by the dam. The subject must be an instance of the class dam. The object must be an instance of the class reservoir.
        meaning: wdt:P4661

      drainage_basin:
        description: The drainage basin associated with the watercourse. The subject must be an instance of the class watercourse. The object must be an instance of the class drainage basin.
        meaning: wdt:P4614

      mountains_classification:
        description: The person associated with the mountains classification of the cycling race. The subject must be an instance of the class cycling race. The object must be an instance of the class human.
        meaning: wdt:P4320

      habitat:
        description: The habitat of the taxon. The subject must be an instance of the class taxon. The object must be an instance of the class body of water.
        meaning: wdt:P2974

classes:
  KnowledgeGraph:
    tree_root: true
    description: >-
      The root extraction object. Contains a collection of subject-predicate-
      object triples describing nature-related entities and facts.
    attributes:
      triples:
        range: Triple
        multivalued: true
        description: >-
            Extract every relationship explicitly mentioned in the input text that can be represented using the permitted ontology predicates.
            The only permitted predicates and their definitions are:

            parent_taxon: The parent taxon of the taxon. The subject must be an instance of the class taxon. The object must be an instance of the class taxon.
            mountain_range: The mountain range to which the mountain belongs. The subject must be an instance of the class mountain. The object must be an instance of the class mountain range.
            parent_peak: The parent peak of the mountain. The subject must be an instance of the class mountain. The object must be an instance of the class mountain.
            taxon_common_name: The common name of the taxon. The subject must be an entity of class Q7432 (class label not specified in the source ontology).
            tributary: A watercourse that flows into the subject watercourse. The subject must be an instance of the class watercourse. The object must be an instance of the class watercourse.
            origin_of_the_watercourse: The source or origin of the watercourse. The subject must be an instance of the class watercourse. The object must be an instance of the class body of water.
            mouth_of_the_watercourse: The watercourse into which the subject watercourse flows at its mouth. The subject must be an instance of the class watercourse. The object must be an instance of the class watercourse.
            iucn_conservation_status: The IUCN conservation status of the taxon. The subject must be an instance of the class taxon. The object must be an instance of the class conservation status.
            taxon_synonym: A synonym of the taxon name. The subject must be an instance of the class taxon. The object must be an instance of the class synonym.
            reservoir_created: The reservoir created by the dam. The subject must be an instance of the class dam. The object must be an instance of the class reservoir.
            drainage_basin: The drainage basin associated with the watercourse. The subject must be an instance of the class watercourse. The object must be an instance of the class drainage basin.
            mountains_classification: The person associated with the mountains classification of the cycling race. The subject must be an instance of the class cycling race. The object must be an instance of the class human.
            habitat: The habitat of the taxon. The subject must be an instance of the class taxon. The object must be an instance of the class body of water.

            Select predicates according to their definitions. Use the exact spelling of the permitted predicate names. Do not
            invent predicates or use alternative predicate names. Do not include relationships that cannot be represented using the permitted
            predicates.

            Each triple must contain exactly one subject, one predicate, and one object, in that order. Within each triple, separate the subject, predicate,
            and object using commas. Separate distinct triples using semicolons.
            
            Extract a separate triple for each distinct object associated with the same subject and predicate.

            Do not invent entities, relationships, or values that are not supported by the input text.

  Triple:
    description: >-
      A single subject-predicate-object statement extracted from the input text.
      The subject identifies the entity being described, the predicate identifies
      the relationship or property, and the object provides the related entity
      or literal value. Each triple must be in the format of subject, predicate, object, where each item is separated by commas.
    attributes:
      subject:
        description: >-
          The subject of the triple. Preserve the subject supplied
          in the input triple exactly as provided. Do not replace,
          reinterpret, infer, expand, or resolve the subject using
          external knowledge. Do not introduce an entity name that
          is absent from the supplied input triple.
        range: string
        required: true

      predicate:
        description: >-
          The relationship or property connecting the subject and object.
          Preserve the predicate supplied in the input triple exactly as
          provided. Do not reinterpret, normalise, correct, or substitute
          the predicate with another relationship.
          The permitted predicates are defined in the DefinedPredicates enum.
          If the supplied predicate is not permitted, return the original
          predicate unchanged so that it can be rejected during validation.
          Return only the predicate value. Do not provide explanations,
          notes, warnings, suggested corrections, or alternative predicates.
        range: DefinedPredicates
        required: true

      object:
        description: >-
          The object of the triple. This is the entity, concept, date, or
          literal value associated with the subject through the predicate.
          Return the extracted value as text. Do not combine multiple entities
          into a single object. Create a separate triple for each distinct
          object associated with the same subject and predicate.
        range: string
        required: true
